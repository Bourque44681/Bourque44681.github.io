<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>
      body{
        overflow: none;
      }

      .box {
        width: 70px;
        height: 70px;
        background-color: teal;
        font-size: 200%;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        /* Change me! */
        /* No! */
        left: 0px;
        border-radius: 1vw;
        cursor:pointer;
      }

      .board {
        height: 95vh;
      }

      #hippos{
        position: absolute;
        left:50%;
        top:-10%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
    </style>
    <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
  </head>

  <body class="board">
    <!-- HTML for the box -->
    <div class="box"><h1 id = "hippos">0</h1></div>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        //////////////////////////////////////////////////////////////////

        var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen
        var boardHeight = board.height();
        board.css("border", "3px solid black");
        var scoreTXT = document.getElementById("hippos");
        box.css("top", boardHeight/2);
        box.css("left", boardWidth/2);

        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
          boardHeight = board.height();
          box.css("top", boardHeight/2);
          box.css("left", boardWidth/2);
          positionX = boardWidth/2;
          positionY = boardHeight/2;
        });

        // Every 50 milliseconds, call the update Function (see below)
        requestAnimationFrame(update);

        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);

        // moves the Box to a new position on the screen along the X-Axis
        function moveBoxTo(newPosition, where) {
          if (where === false){
            box.css("left", newPosition);
          }
          else{
            box.css("top", newPosition)
          }
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
          scoreTXT.textContent = newText;
        }

        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // TODO 2 - Variable declarations
        var positionX = boardWidth/2;
        var positionY = boardHeight/2;
        var points = 0;
        var speedX = 2;
        var speedY = 2;


        /**
         * This Function will be called 20 times/second.
         * Each time it is called, it should move the Box to a new location.
         * If the box drifts off the screen, turn it around!
         */
        function update() {
          positionX += speedX;
          positionY += speedY;
          moveBoxTo(positionX, false);
          moveBoxTo(positionY, true);
          if (positionX > boardWidth - 75){ //so it doesn't go in the wall
            speedX = speedX * -1;
          }
          else if (positionX < 25){
            speedX = speedX * -1;
          }
          else if (positionY < 30){
            speedY = speedY * -1;
          }
          else if (positionY > boardHeight + -70){
            speedY = speedY * -1;
          }
          requestAnimationFrame(update);
        }

        /**
         * This Function will be called each time the box is clicked.
         * Each time it is called, it should perform each of the following actions:
         * - increase the points total
         * - increase the speed
         * - move the box to the left side of the screen.
         */
        function handleBoxClick() {
          points++;
          changeBoxText(points);

          speedX = 2 * points + 1;
          speedY = 2 * points + .7;

          var up = Math.floor(Math.random()*2);
          var side = Math.floor(Math.random()*2);
          if (up === 1){
            speedY = speedY*-1;
          }
          if (side === 1){
            seedX = speedX * -1;
          }
        }


        
      })();
    </script>
  </body>
</html>
